<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI toolbar mock</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800&display=swap">
<style>
/* TAB-123 mock of the floating AI prompt toolbar. Static: nothing here calls a model.
   Tokens and chrome classes (.tray, .icon-btn, .btn, .chip, .input, .tip, kbd, .toast) are copied from src/styles.css and
   src/ui/tooltip.css so the bar sits next to the real trays. Colour comes only from var() and color-mix(). */

:root {
  --canvas: #EEF1F4; --paper: #FFFFFF; --ink: #18212B; --graphite: #5B6672; --rule: #D5DBE2;
  --signal: #FFD23F; --wire: #2F6FED; --danger: #D41E24; --on-signal: #18212B;
  --canvas-ink: #18212B; --canvas-rule: #C9D1DA;
  --tray: #18212B; --tray-2: #222D39; --tray-line: rgba(233, 237, 242, 0.12); --tray-text: #E9EDF2; --tray-muted: #98A4B1; --tray-hover: rgba(233, 237, 242, 0.08);
  --grid-dot: #AEB8C4; --grid-line: #DDE3E9; --grid-major: #C6CFD8;
  --ui: 'Switzer', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --display: 'Cabinet Grotesk', 'Switzer', ui-sans-serif, system-ui, sans-serif;
  --radius-xs: 4px; --radius-sm: 8px; --radius-md: 12px; --radius-lg: 14px; --radius: var(--radius-md); --rail-clear: 76px;
  --shadow: 0 0 0 1px var(--tray-line);
  /* Board content, not chrome: the sticky palette from src/palette.ts, the same in every theme. */
  --s-yellow: #FFE16B; --s-orange: #FFB979; --s-pink: #FFA3C4; --s-violet: #CDB8FF; --s-blue: #A3D2FF; --s-teal: #8FE3CA; --s-green: #BCE88C;
  --sticky-ink: #1D1A12;
  /* Set by the script from the bottom chrome. */
  --ai-bottom: 16px;
}
:root[data-theme='ayu'] {
  color-scheme: dark;
  --canvas: #1F2430;
  --paper: #272D38;
  --ink: #CCCAC2;
  --graphite: #8F969D;
  --rule: #3D4455;
  --signal: #FFCC66;
  --on-signal: #1F2430;
  --wire: #73D0FF;
  --danger: #F28779;
  --tray: #171B24;
  --tray-2: #232834;
  --tray-line: rgba(204, 202, 194, 0.12);
  --tray-text: #CCCAC2;
  --tray-muted: #8A9199;
  --tray-hover: rgba(204, 202, 194, 0.08);
  --grid-dot: #3A4150;
  --grid-line: #2A3040;
  --grid-major: #3A4150;
  --canvas-ink: #CCCAC2;
  --canvas-rule: #3D4455;
}
:root[data-theme='kanagawa'] {
  color-scheme: dark;
  --canvas: #1F1F28;
  --paper: #2A2A37;
  --ink: #DCD7BA;
  --graphite: #A6A69C;
  --rule: #363646;
  --signal: #E6C384;
  --on-signal: #1F1F28;
  --wire: #7E9CD8;
  --danger: #E56E7B;
  --tray: #16161D;
  --tray-2: #2A2A37;
  --tray-line: rgba(220, 215, 186, 0.12);
  --tray-text: #DCD7BA;
  --tray-muted: #9C9A8A;
  --tray-hover: rgba(220, 215, 186, 0.08);
  --grid-dot: #3A3A4A;
  --grid-line: #2A2A37;
  --grid-major: #3A3A4A;
  --canvas-ink: #DCD7BA;
  --canvas-rule: #54546D;
}
:root[data-theme='matrix'] {
  color-scheme: dark;
  --canvas: #050A06;
  --paper: #0B140C;
  --ink: #3DFF70;
  --graphite: #1FA84A;
  --rule: #14501F;
  --signal: #00FF41;
  --on-signal: #021004;
  --wire: #22D3EE;
  --danger: #FF4D4D;
  --tray: #0A120B;
  --tray-2: #102014;
  --tray-line: rgba(61, 255, 112, 0.16);
  --tray-text: #8CFFA8;
  --tray-muted: #3FBF62;
  --tray-hover: rgba(61, 255, 112, 0.1);
  --grid-dot: #0F3A1A;
  --grid-line: #0B2412;
  --grid-major: #124B22;
  --canvas-ink: #3DFF70;
  --canvas-rule: #14501F;
}
:root[data-theme='evergreen'] {
  color-scheme: light;
  --canvas: #EEF3EC;
  --paper: #FFFFFF;
  --ink: #14301F;
  --graphite: #4F6B5A;
  --rule: #CBD9CE;
  --signal: #E0B040;
  --on-signal: #14301F;
  --wire: #1E6FD9;
  --danger: #C14036;
  --tray: #0F2A1D;
  --tray-2: #1B3F2C;
  --tray-line: rgba(226, 240, 228, 0.14);
  --tray-text: #E6F2E8;
  --tray-muted: #9DB8A5;
  --tray-hover: rgba(226, 240, 228, 0.09);
  --grid-dot: #A9BDAE;
  --grid-line: #D8E3DB;
  --grid-major: #BCCDC1;
  --canvas-ink: #14301F;
  --canvas-rule: #CBD9CE;
}


* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.45 var(--ui); color: var(--ink); background: var(--canvas); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.ico { display: inline-flex; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ------------------------------------------------ reviewer panel (not part of the product) */
.review { flex: none; padding: 12px 16px; background: var(--paper); color: var(--ink); border-bottom: 2px solid var(--ink); }
.review :focus-visible { outline: 2px solid var(--ink); }
.review h1 { margin: 0 0 8px; font: 700 11px/16px var(--ui); letter-spacing: 0.08em; text-transform: uppercase; }
.review h1 span { color: var(--graphite); font-weight: 500; letter-spacing: 0; text-transform: none; margin-left: 8px; }
.review-grid { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: end; }
.review label { display: flex; flex-direction: column; gap: 2px; font: 600 11px/16px var(--ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--graphite); }
.review select, .review button { height: 32px; padding: 0 8px; border: 1px solid var(--rule); border-radius: var(--radius-sm); background: var(--paper); font: 500 13px var(--ui); color: var(--ink); text-transform: none; letter-spacing: 0; }
.review button:hover, .review select:hover { border-color: var(--ink); }
.review .chk { flex-direction: row; align-items: center; gap: 8px; height: 32px; }
.review .chk input { width: 16px; height: 16px; border-radius: var(--radius-xs); accent-color: var(--ink); }
.review .note { flex: 1 1 280px; margin: 0; font-size: 12px; color: var(--graphite); }

/* ------------------------------------------------ the fake board */
.board-root { position: relative; flex: 1 1 0; min-height: 0; overflow: hidden; background-color: var(--canvas);
  background-image: radial-gradient(circle, var(--grid-dot) 1.1px, transparent 1.3px); background-size: 24px 24px; background-position: 12px 12px; }
body.bare .review { display: none; }
body.bare { height: 100vh; }

.chrome { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
.chrome > * { pointer-events: auto; }
.tray { background: var(--tray); color: var(--tray-text); border-radius: var(--radius); box-shadow: var(--shadow); color-scheme: dark; }
:root:not([data-theme='default']) .tray { box-shadow: var(--shadow), 0 0 0 1px var(--tray-line); }
.tray .muted { color: var(--tray-muted); }

.icon-btn, .rail-btn { display: inline-grid; place-items: center; border: 0; background: transparent; border-radius: var(--radius-sm); color: inherit; width: 36px; height: 36px; padding: 0; flex: none; }
.icon-btn:hover, .rail-btn:hover { background: var(--tray-hover); }
.icon-btn.on, .rail-btn.on { background: var(--signal); color: var(--on-signal); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border: 0; border-radius: var(--radius-sm); background: var(--tray-hover); font-weight: 500; white-space: nowrap; }
.btn:hover { background: color-mix(in srgb, var(--tray-text) 14%, transparent); }
.btn.primary { background: var(--signal); color: var(--on-signal); font-weight: 600; }
.btn.primary:hover { background: color-mix(in srgb, var(--signal) 85%, var(--paper)); }
.btn.ghost { background: transparent; }
.btn.ghost:hover { background: var(--tray-hover); }
[aria-disabled='true'] { opacity: 0.4; cursor: default; }

/* stubs of the real chrome */
.top-left { position: absolute; left: 12px; top: 12px; display: flex; align-items: center; gap: 4px; padding: 4px; }
.top-right { position: absolute; right: 12px; top: 12px; display: flex; align-items: center; gap: 4px; padding: 4px; }
.board-name { padding: 0 8px; font-weight: 600; max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sync-status { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--radius-xs); background: color-mix(in srgb, var(--tray-text) 8%, transparent); color: var(--tray-muted); font-size: 12.5px; font-weight: 500; }
.avatar { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--tray); background: var(--graphite); color: var(--tray-text); font: 700 11px var(--ui); display: grid; place-items: center; }
.rail { position: absolute; left: 12px; top: 72px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px; }
.rail-btn { width: 40px; height: 40px; }
.rail hr { width: 100%; height: 1px; border: 0; background: var(--tray-line); margin: 4px 0; }
.zoom-tray { position: absolute; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 2px; padding: 4px; }
.zoom-label { min-width: 54px; height: 36px; border: 0; border-radius: var(--radius-sm); background: transparent; font-weight: 600; }
.menu { position: absolute; right: 12px; top: 64px; min-width: 200px; padding: 4px; border-radius: var(--radius-md); box-shadow: 0 0 0 1px var(--tray-line), 0 2px 8px color-mix(in srgb, var(--tray) 30%, transparent); z-index: 30; }
.menu-item { display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--tray-text); text-align: left; font-size: 13px; }
.menu-item:hover { background: var(--tray-hover); }

/* the session bar (stub of .flowbar) */
.flowbar { position: absolute; left: 0; right: 0; bottom: 12px; margin: 0 auto; width: fit-content; max-width: calc(100% - 456px); display: none; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px; }
.flowbar.show { display: flex; }
.flow-step { display: flex; align-items: center; gap: 10px; min-width: 150px; height: 36px; padding: 0 10px 0 6px; }
.step-count { flex: none; padding: 3px 7px; border-radius: var(--radius-xs); background: var(--tray-2); color: var(--tray-muted); font-size: 12px; font-weight: 600; }
.step-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.step-instr { color: var(--tray-muted); font-size: 12.5px; white-space: nowrap; }
.timer { width: 84px; height: 36px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--tray-text) 6%, transparent); display: grid; place-items: center; flex: none; font: 700 17px var(--ui); letter-spacing: 0.02em; }
.bar-sep { width: 1px; align-self: stretch; margin: 4px 4px; background: var(--tray-line); }
@media (max-width: 860px) {
  .flowbar { left: var(--rail-clear); right: 12px; max-width: none; bottom: 60px; margin: 0; width: auto; }
  .flowbar .bar-sep { display: none; }
  .rail-btn { width: 34px; height: 34px; }
  .rail { gap: 1px; }
}

/* objects on the canvas */
.world { position: absolute; inset: 0; }
.sticky { position: absolute; width: var(--ss, 104px); height: var(--ss, 104px); padding: 10px; background: var(--c, var(--s-yellow)); color: var(--sticky-ink); font: 500 12.5px/1.25 var(--ui); overflow: hidden; overflow-wrap: anywhere;
  box-shadow: 0 1px 2px color-mix(in srgb, var(--canvas-ink) 28%, transparent); }
.frame { position: absolute; border: 2px solid var(--canvas-rule); background: color-mix(in srgb, var(--paper) 45%, transparent); }
.frame-title { position: absolute; left: -2px; top: -26px; font: 600 13px/20px var(--ui); color: var(--canvas-ink); white-space: nowrap; }
.sel-box { position: absolute; border: 1.5px solid var(--wire); pointer-events: none; display: none; }
.sel-box i { position: absolute; width: 8px; height: 8px; background: var(--paper); border: 1.5px solid var(--wire); }
.sel-box i:nth-child(1) { left: -5px; top: -5px; } .sel-box i:nth-child(2) { right: -5px; top: -5px; } .sel-box i:nth-child(3) { left: -5px; bottom: -5px; } .sel-box i:nth-child(4) { right: -5px; bottom: -5px; }
.sticky.sel { outline: 1.5px solid var(--wire); outline-offset: 0; }
.quickbar { position: absolute; left: 0; top: 0; display: none; align-items: center; gap: 2px; padding: 4px; z-index: 12; }
.quickbar.show { display: flex; }
.qb-sep { flex: none; width: 1px; height: 20px; margin: 0 4px; background: var(--tray-line); }
.qb-chip { display: block; width: 18px; height: 18px; border-radius: var(--radius-xs); background: var(--c); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--tray-text) 35%, transparent); }

/* preview ghosts */
.pv { display: none; }
/* Ghost stickies keep their true colours (no opacity: translucent stickies turn muddy on dark canvases); a dashed canvas-ink edge marks them as not yet on the board. */
.sticky.pv { box-shadow: none; outline: 1.5px dashed color-mix(in srgb, var(--canvas-ink) 55%, transparent); outline-offset: -1.5px; }
.pv[data-on='0'] { display: none !important; }
/* The proposal area: a dashed canvas-ink edge (>= 3:1 on every canvas) and a faint --signal wash; --signal itself carries only the label. */
.ghost-area { position: absolute; display: none; border: 2px dashed color-mix(in srgb, var(--canvas-ink) 55%, transparent); background: color-mix(in srgb, var(--signal) 8%, transparent); pointer-events: none; }
.ghost-label { position: absolute; left: -2px; top: -22px; height: 20px; padding: 0 8px; background: var(--signal); color: var(--on-signal); font: 600 11px/20px var(--ui); letter-spacing: 0.08em; text-transform: uppercase; }
.ghost-head { position: absolute; display: none; font: 700 13px/20px var(--ui); color: var(--canvas-ink); border-bottom: 2px dashed var(--canvas-ink); padding-bottom: 2px; }
.arrows { position: absolute; inset: 0; width: 100%; height: 100%; display: none; pointer-events: none; color: color-mix(in srgb, var(--canvas-ink) 32%, transparent); }
body[data-preview='create'] .pv.k-create, body[data-preview='create'] .ghost-area.k-create { display: block; }
body[data-preview='group'] .pv.k-group, body[data-preview='group'] .ghost-area.k-group, body[data-preview='group'] .ghost-head, body[data-preview='group'] .arrows { display: block; }
body[data-preview='group'] .ghost-head { display: block; }
body[data-added='create'] .pv.k-create { display: block; outline: none; box-shadow: 0 1px 2px color-mix(in srgb, var(--canvas-ink) 28%, transparent); }
body[data-added='create'] .ghost-frame { display: block; }
body[data-added='group'] .pv.k-group { display: block; outline: none; box-shadow: 0 1px 2px color-mix(in srgb, var(--canvas-ink) 28%, transparent); }
body[data-added='group'] .ghost-head { display: block; border-bottom-style: solid; }
body[data-added='group'] .sticky.moved { visibility: hidden; }
.ghost-frame { display: none; }

/* ------------------------------------------------ other people's runs (TAB-141) */
/* --ana is a person's colour (USER_COLORS in src/palette.ts), set per person like cursor colours; --ana-ink is white or the ink, whichever contrasts more. */
.avatar.oth-av { position: relative; z-index: 1; background: var(--ana); color: var(--ana-ink); cursor: default; }
.oth-badge { position: absolute; right: -6px; bottom: -5px; width: 14px; height: 14px; border-radius: 50%; display: none; place-items: center; background: var(--signal); color: var(--on-signal); box-shadow: 0 0 0 2px var(--tray); }
.oth-av.busy .oth-badge { display: grid; }
.top-right .avatar + .avatar { margin-left: -6px; }
@media (max-width: 600px) { .top-right .avatar + .avatar { display: none; } }
.oth-run { position: absolute; display: none; pointer-events: none; z-index: 4; }
.oth-ring { position: absolute; inset: 0; border: 2px solid var(--ana); border-radius: 0; box-shadow: 0 0 0 4px color-mix(in srgb, var(--ana) 18%, transparent); animation: oth-pulse 2.4s ease-in-out infinite; }
@keyframes oth-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .oth-ring { animation: none; opacity: 1; border-style: dashed; box-shadow: none; } }
.oth-label { flex: none; height: 20px; padding: 0 8px; background: var(--ana); color: var(--ana-ink); font: 600 11px/20px var(--ui); white-space: nowrap; }
.oth-head .oth-label { letter-spacing: 0.08em; text-transform: uppercase; }
.oth-run > .oth-label { position: absolute; left: -2px; bottom: 100%; margin-bottom: 4px; }
.oth-area { position: absolute; display: none; border: 2px dashed var(--ana); background: color-mix(in srgb, var(--ana) 8%, transparent); pointer-events: none; }
.sticky.oth-pv { display: none; z-index: 2; box-shadow: none; outline: 1.5px dashed color-mix(in srgb, var(--ana) 80%, var(--canvas-ink)); outline-offset: -1.5px; }
.sticky.pv { z-index: 3; }
.ghost-area { z-index: 3; }
.ghost-label { z-index: 6; }
.oth-head { position: absolute; display: none; align-items: stretch; gap: 4px; z-index: 6; height: 20px; }
.oth-actions { display: flex; align-items: center; gap: 2px; padding: 0 2px; height: 24px; margin-top: -2px; border-radius: var(--radius-md); }
.oth-actions[hidden] { display: none; }
.oth-btn { height: 20px; padding: 0 8px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--tray-text); font: 600 11.5px/20px var(--ui); }
.oth-btn:hover { background: var(--tray-hover); }
.oth-btn.primary { background: var(--signal); color: var(--on-signal); }
.oth-btn.primary:hover { background: color-mix(in srgb, var(--signal) 85%, var(--paper)); }
.board-root[data-other='running'] .oth-run { display: block; }
.board-root[data-other='preview'] .oth-area, .board-root[data-other='preview'] .oth-head { display: flex; }
.board-root[data-other='preview'] .oth-area { display: block; }
.board-root[data-other='preview'] .sticky.oth-pv:not([hidden]) { display: block; }
.board-root[data-other-done='accept'] .sticky.oth-pv:not([hidden]) { display: block; outline: none; box-shadow: 0 1px 2px color-mix(in srgb, var(--canvas-ink) 28%, transparent); }
.pop-switch { display: flex; gap: 10px; align-items: flex-start; padding: 8px; color: var(--tray-muted); font-size: 12px; line-height: 1.4; cursor: pointer; }
.pop-switch b { color: var(--tray-text); font-weight: 600; }
.pop-switch input { flex: none; margin: 2px 0 0; width: 16px; height: 16px; accent-color: var(--signal); }

/* ------------------------------------------------ the AI bar */
/* Centred on the page, not on the canvas beside the rail: equal insets keep the collapsed button and the open bar on the page's centre line and clear of the zoom tray (244px) on both sides. */
.ai-dock { position: absolute; bottom: var(--ai-bottom); left: 244px; right: 244px; display: flex; justify-content: center; pointer-events: none; z-index: 11; }
.ai-dock > * { pointer-events: auto; }
.ai-dock.dragged { right: auto; justify-content: flex-start; }
/* Below 1000px the 488px of insets leave too little room, so the bar rises above the zoom tray (stack() sets --ai-bottom) and keeps equal insets. */
@media (max-width: 1000px) { .ai-dock:not(.dragged) { left: calc(var(--rail-clear) + 12px); right: calc(var(--rail-clear) + 12px); } }
@media (max-width: 860px) { .ai-dock:not(.dragged) { left: 12px; right: 12px; } }

.ai-fab { width: 40px; height: 40px; border: 0; padding: 0; display: inline-grid; place-items: center; color: var(--tray-text); }
.ai-fab:hover { background: color-mix(in srgb, var(--tray) 85%, var(--tray-text)); }
.ai-fab[hidden], .ai-bar[hidden] { display: none; }

.ai-bar { position: relative; width: min(640px, 100% - 0px); display: flex; flex-direction: column; overflow: hidden; font-size: 13px;
  transition: opacity 160ms ease, transform 160ms ease; }
.ai-dock:not(.dragged) .ai-bar { width: min(640px, 100%); }
.ai-dock.dragged .ai-bar { width: min(640px, calc(100vw - 24px)); }
.ai-bar[data-open='false'] { opacity: 0; transform: translateY(8px); pointer-events: none; }
.ai-fab { transition: opacity 160ms ease, transform 160ms ease; }
.ai-fab[data-open='false'] { opacity: 0; transform: translateY(8px); pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .ai-bar, .ai-fab { transition: none; } }

/* DOM order is the tab order (row 2, then the chips); visual order is set here. */
.ai-chips { order: 1; display: flex; gap: 6px; padding: 8px 8px 0; overflow-x: auto; scrollbar-width: none; }
.ai-chips::-webkit-scrollbar { display: none; }
.ai-main { order: 2; display: flex; align-items: center; gap: 8px; padding: 8px; min-height: 52px; }
.ai-disclosure { order: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; padding: 6px 12px 8px; border-top: 1px solid var(--tray-line); font-size: 11px; line-height: 16px; color: var(--tray-muted); }
.ai-disclosure .sep::before { content: '\00B7'; margin-right: 8px; }

.chip { flex: none; height: 28px; padding: 0 12px; border: 0; border-radius: var(--radius-xs); background: color-mix(in srgb, var(--tray-text) 6%, transparent); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.chip:hover { background: var(--tray-hover); }
.chip[aria-disabled='true']:hover { background: color-mix(in srgb, var(--tray-text) 6%, transparent); }
/* armed: the app's .chip.on */
.chip.on, .chip.on:hover { background: var(--tray-text); color: var(--tray); }

.ai-input:focus { border-color: var(--signal); }
.ai-input::placeholder { color: var(--tray-muted); opacity: 1; }
.ai-hist { position: absolute; right: 2px; top: 2px; width: 32px; height: 32px; }
.ai-status { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px; font-weight: 500; }
.ai-status span.t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-summary { flex: 1 1 0; min-width: 0; padding: 0 4px; font-weight: 500; line-height: 1.3; }
.ai-summary small { display: block; font-size: 11px; font-weight: 400; color: var(--tray-muted); }
.ai-error { flex: 1 1 0; min-width: 0; display: flex; align-items: flex-start; gap: 8px; padding: 0 4px; color: color-mix(in srgb, var(--danger) 54%, var(--tray-text)); font-weight: 500; line-height: 1.35; }

.ai-bar[data-ui='running'] .ai-chips, .ai-bar[data-ui='preview'] .ai-chips { opacity: 0.4; pointer-events: none; }

.ai-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; overflow: hidden; display: none; }

.ai-progress::before { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 30%; background: var(--signal); animation: ai-slide 1.4s linear infinite; }

.pop { position: absolute; z-index: 20; min-width: 240px; max-width: 320px; padding: 4px; border-radius: var(--radius-md); box-shadow: 0 0 0 1px var(--tray-line), 0 2px 8px color-mix(in srgb, var(--tray) 30%, transparent); font-size: 13px; }

.tip { position: fixed; left: 0; top: 0; z-index: 90; display: flex; align-items: baseline; gap: 8px; width: max-content; max-width: 280px; padding: 4px 8px; background: var(--tray-text); color: var(--tray); border: 1px solid var(--tray); border-radius: var(--radius-md); font: 500 12px/16px var(--ui); pointer-events: none; opacity: 0; visibility: hidden; transition: opacity 120ms ease, visibility 0s linear 120ms; }

/* TAB-123 mock. Every behaviour here is faked; the comments say what the real build would do. */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ic = (name, size = 18) => `<span class="ico" aria-hidden="true"><svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#i-${name}"/></svg></span>`;
const store = {

  moreMenu.innerHTML = ['Board settings', 'Export board'].map((l) => `<button class="menu-item" role="menuitem">${l}</button>`).join('') + (isAdmin() && !S.ai ? '<hr style="border:0;height:1px;background:var(--tray-line);margin:4px 0"><button class="menu-item" role="menuitem" id="setupAi">Set up AI</button>' : '');
  moreMenu.hidden = !open; moreBtn.setAttribute('aria-expanded', String(open));
  const s = $('#setupAi'); if (s) s.onclick = () => { moreMenu.hidden = true; toast('Opens AI settings in the admin dashboard. (mock)'); };
});

/* ------------------------------------------------------------------ panel */
const THEMES = [["default","Default"],["ayu","Ayu"],["kanagawa","Kanagawa"],["matrix","Matrix"],["evergreen","Evergreen"]];
$('#p-theme').innerHTML = THEMES.map(([id, n]) => `<option value="${id}">${n}</option>`).join('');
$('#p-theme').onchange = (e) => { S.theme = e.target.value; paint(); };
$('#p-role').onchange = (e) => { S.role = e.target.value; closePop(); paint(); };
$('#p-ai').onchange = (e) => { S.ai = e.target.checked; paint(); };
$('#p-key').onchange = (e) => { S.key = e.target.value; paint(); };
$('#p-sel').onchange = (e) => { S.sel = Number(e.target.value); S.ctx = S.sel ? 'sel' : S.ctx === 'sel' ? 'view' : S.ctx; paint(); };
$('#p-ctx').onchange = (e) => { S.ctx = e.target.value; if (S.ctx === 'sel' && !S.sel) S.sel = 3; paint(); };
$('#p-session').onchange = (e) => { S.session = e.target.checked; paint(); };
$('#p-out').onchange = (e) => { S.out = e.target.value; paint(); };
$('#p-chips').onchange = (e) => { S.chips = e.target.value; paint(); };
$('#p-reset').onclick = () => { for (const k of ['ai-bar', 'ai-bar-pos', 'ai-history']) store.del(k); history = ['ten risks of moving to the cloud', 'ideas for the retro warm-up', 'five ways to speed up deploys']; dockAgain(); S.open = true; paint(); };
$('#p-state').onchange = (e) => setState(e.target.value);
$('#p-other').onchange = (e) => { S.other = e.target.value; S.otherDone = null; if (S.other !== 'preview') S.two = 'off'; paint(); };
$('#p-two').onchange = (e) => { S.two = e.target.value; S.otherDone = null; if (S.two !== 'off') { S.other = 'preview'; S.ui = 'preview'; S.feature = 'summarise'; } paint(); };
$('#p-priv').onchange = (e) => { S.priv = e.target.checked; if (S.priv) S.key = 'user'; paint(); };
$('#p-anawins').onchange = (e) => { S.anaWins = e.target.checked; };

function setState(v) {
  clearTimeout(runTimer); clearInterval(cdTimer); closePop(); S.added = null; S.err = null; S.prompt = ''; S.ui = 'idle'; S.open = true; $('#toast').classList.remove('show');
  if (v === 'collapsed') S.open = false;
  S.armed = null;
  if (v === 'typing') S.prompt = 'ten risks of moving to the cloud';
  if (v === 'armed') S.armed = 'summarise';
  if (v === 'armed-cluster') { S.armed = 'cluster'; S.sel = 9; S.ctx = 'sel'; }
  if (v === 'armed-ideas') { S.armed = 'ideas'; S.prompt = 'ten risks of moving to the cloud'; }
  if (v === 'from-menu') { S.armed = 'summarise'; S.ctx = 'board'; }
  if (v === 'from-tray') { S.armed = 'ideas'; S.ctx = 'none'; }
  if (v === 'from-quickbar') { S.armed = 'cluster'; S.sel = 9; S.ctx = 'sel'; }
  if (v === 'running') { S.ui = 'running'; if (!FEATURES[S.feature]) S.feature = 'summarise'; }
  if (v === 'preview') { S.ui = 'preview'; S.feature = 'summarise'; }
  if (v === 'preview-group') { S.ui = 'preview'; S.feature = 'cluster'; S.sel = 9; S.ctx = 'sel'; }
  if (v === 'added') { S.feature = 'summarise'; S.added = 'create'; }
  if (v.startsWith('err-')) { S.feature = 'summarise'; fail(v.slice(4)); }
  paint();
  if (v === 'added') toast('Added 6 stickies.', 'Undo', () => { S.added = null; paint(); });
  if (v.startsWith('from-')) setTimeout(() => prompt.focus(), 0);
}

new ResizeObserver(() => { layout(); }).observe(board);
if (params.has('ctx') && params.get('ctx') === 'sel' && !params.has('sel')) S.sel = 3;
paint();
layout();
$('#p-state').value = params.get('state') || 'idle';
if (params.get('state')) setState(params.get('state'));
if (S.two !== 'off') { S.other = 'preview'; S.ui = 'preview'; S.feature = 'summarise'; paint(); }
if (S.priv) { S.key = 'user'; paint(); }
document.fonts && document.fonts.ready.then(() => { layout(); });
window.__mock = { S, setState, paint, otherAct };

</script>
</body>
</html>
