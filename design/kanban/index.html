  --grid-dot: #AEB8C4;
  --grid-line: #DDE3E9;
  --grid-major: #C6CFD8;
  --canvas-ink: #18212B;
  --canvas-rule: #C9D1DA;

}

  --paper: #272D38;

  --tray-line: rgba(204, 202, 194, 0.12);
  --tray-text: #CCCAC2;

  --tray-hover: rgba(204, 202, 194, 0.08);
  --grid-dot: #3A4150;
  --grid-line: #2A3040;
  --grid-major: #3A4150;
  --canvas-ink: #CCCAC2;
  --canvas-rule: #3D4455;
  --guide: #FF7EB6;
}
:root[data-theme='kanagawa'] {
  color-scheme: dark;
  --canvas: #1F1F28;

  --tray-hover: rgba(220, 215, 186, 0.08);
  --grid-dot: #3A3A4A;
  --grid-line: #2A2A37;
  --grid-major: #3A3A4A;
  --canvas-ink: #DCD7BA;
  --canvas-rule: #54546D;
  --guide: #D27E99;
}
:root[data-theme='matrix'] {
  color-scheme: dark;
  --canvas: #050A06;
  --paper: #0B140C;
  --ink: #3DFF70;
  --graphite: #1FA84A;
  --rule: #14501F;
  --signal: #00FF41;
  --on-signal: #021004;
  --wire: #22D3EE;
  --danger: #FF4D4D;
  --tray: #0A120B;
  --tray-2: #102014;
  --tray-line: rgba(61, 255, 112, 0.16);
  --tray-text: #8CFFA8;
  --tray-muted: #3FBF62;
  --tray-hover: rgba(61, 255, 112, 0.1);
  --grid-dot: #0F3A1A;
  --grid-line: #0B2412;
  --grid-major: #124B22;
  --canvas-ink: #3DFF70;
  --canvas-rule: #14501F;
  --guide: #FF4FA3;
}
:root[data-theme='evergreen'] {
  color-scheme: light;
  --canvas: #EEF3EC;
  --paper: #FFFFFF;
  --ink: #14301F;
  --graphite: #4F6B5A;
  --rule: #CBD9CE;
  --signal: #E0B040;
  --on-signal: #14301F;
  --wire: #1E6FD9;
  --danger: #C14036;
  --tray: #0F2A1D;
  --tray-2: #1B3F2C;
  --tray-line: rgba(226, 240, 228, 0.14);
  --tray-text: #E6F2E8;
  --tray-muted: #9DB8A5;
  --tray-hover: rgba(226, 240, 228, 0.09);
  --grid-dot: #A9BDAE;
  --grid-line: #D8E3DB;
  --grid-major: #BCCDC1;
  --canvas-ink: #14301F;
  --canvas-rule: #CBD9CE;
  --guide: #D6247F;
}
:root {
  /* Board content, the same in every theme: sticky palette, person colours (src/palette.ts), pin ring (src/render.ts). */
  --s-yellow: #FFE16B; --s-orange: #FFB979; --s-pink: #FFA3C4; --s-violet: #CDB8FF; --s-blue: #A3D2FF; --s-teal: #8FE3CA; --s-green: #BCE88C; --s-grey: #E2E6EB;
  --sticky-ink: #1D1A12;
  --u0: #2F6FED; --u1: #D64545; --u2: #1E9A6A; --u3: #C98A00; --u4: #7A5AF8; --u5: #E0559B; --u6: #0E9AA7; --u7: #E06D2B;
  --pin-ring: #FFFFFF;
}

/* ------------------------------------------------ derived tokens (board objects follow the canvas tokens) */
:root {
  --ui: 'Switzer', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --display: 'Cabinet Grotesk', 'Switzer', ui-sans-serif, system-ui, sans-serif;
  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 14px;
  --k-lane: color-mix(in srgb, var(--canvas-ink) 5%, var(--canvas));      /* lane body */
  --k-meta: color-mix(in srgb, var(--canvas-ink) 82%, var(--canvas));     /* secondary text on canvas surfaces */
  --k-card-meta: color-mix(in srgb, var(--ink) 72%, var(--paper));        /* secondary text on a card */
  --k-edge: color-mix(in srgb, var(--canvas-ink) 28%, transparent);       /* card hairline (decorative) */
  --k-dim: 0.35;                                                           /* filtered-out cards */
  --k-tween: 120ms;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.45 var(--ui); color: var(--ink); background: var(--canvas); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; overflow-x: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
.ico { display: inline-flex; flex: none; }
.lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; line-height: 16px; }

/* ------------------------------------------------ reviewer panel (not part of the product) */
.review { flex: none; padding: 12px 16px; background: var(--paper); color: var(--ink); border-bottom: 2px solid var(--ink); }
.review h1 { margin: 0 0 8px; font: 700 11px/16px var(--ui); letter-spacing: 0.08em; text-transform: uppercase; }
.review h1 span { color: var(--graphite); font-weight: 500; letter-spacing: 0; text-transform: none; margin-left: 8px; }
.review-grid { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: end; }
.review label { display: flex; flex-direction: column; gap: 2px; font: 600 11px/16px var(--ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--graphite); }
.review select, .review button { height: 32px; padding: 0 8px; border: 1px solid var(--rule); border-radius: var(--radius-sm); background: var(--paper); font: 500 13px var(--ui); color: var(--ink); text-transform: none; letter-spacing: 0; }
.review button:hover, .review select:hover { border-color: var(--ink); }
.review .chk { flex-direction: row; align-items: center; gap: 8px; height: 32px; }
.review .chk input { width: 16px; height: 16px; border-radius: var(--radius-xs); accent-color: var(--ink); }
.review .note { flex: 1 1 280px; margin: 0; font-size: 12px; color: var(--graphite); min-height: 18px; }
body.bare .review { display: none; }
body.bare { height: 100vh; }

/* ------------------------------------------------ the fake board */
.stage { position: relative; flex: 1 1 0; min-height: 0; display: flex; justify-content: center; background: var(--canvas); }
body.w390 .stage { background: color-mix(in srgb, var(--canvas-ink) 12%, var(--canvas)); padding: 16px 0; }
.board-root { position: relative; flex: 1 1 0; min-width: 0; overflow: hidden; background-color: var(--canvas);
  background-image: radial-gradient(circle, var(--grid-dot) 1.1px, transparent 1.3px); background-size: 24px 24px; background-position: 12px 12px; }
body.w390 .board-root { flex: none; width: 390px; }
body.bare.w390 .stage { padding: 0; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

/* chrome stubs, flat (the real trays live in src/styles.css) */
.chrome { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
.bar { position: absolute; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; background: var(--tray); color: var(--tray-text); border-radius: var(--radius-md); pointer-events: auto; }
.top-left { left: 12px; top: 12px; }
.board-name { font-weight: 600; }
.ico-wrap { display: inline-flex; }
.zoom-bar { right: 12px; bottom: 12px; font-weight: 600; font-size: 13px; }

/* ------------------------------------------------ ordinary board objects around the container */
.sticky { position: absolute; width: 104px; height: 104px; padding: 10px; background: var(--c, var(--s-yellow)); color: var(--sticky-ink); font: 500 12.5px/1.25 var(--ui); overflow: hidden; }
.frame { position: absolute; border: 2px solid var(--canvas-rule); }
.frame-title { position: absolute; left: -2px; top: -26px; font: 600 13px/20px var(--ui); color: var(--canvas-ink); white-space: nowrap; }
.shape { position: absolute; border: 2px solid var(--canvas-ink); display: grid; place-items: center; font: 500 13px var(--ui); color: var(--canvas-ink); }

/* ------------------------------------------------ container */
.k-box { position: absolute; background: var(--canvas); border: 1px solid var(--canvas-rule); color: var(--canvas-ink); }
.k-head { position: absolute; left: 0; right: 0; top: 0; height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 12px; border-bottom: 2px solid var(--canvas-ink); }
.k-name { font: 700 17px/24px var(--display); letter-spacing: -0.01em; white-space: nowrap; }
.k-meta { color: var(--k-meta); white-space: nowrap; }
.k-head-end { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.k-fchip { display: inline-flex; align-items: center; gap: 2px; height: 32px; padding: 0 0 0 8px; border: 1px solid var(--canvas-ink); border-radius: var(--radius-xs); color: var(--canvas-ink); background: transparent; }
.k-fchip .k-icon { width: 30px; height: 30px; }
.k-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid var(--canvas-ink); background: transparent; color: var(--canvas-ink); border-radius: var(--radius-sm); }
.k-btn:hover { background: var(--canvas-ink); color: var(--canvas); }
.k-btn.on { background: var(--signal); color: var(--on-signal); border-color: var(--signal); }
.k-btn.on:hover { background: color-mix(in srgb, var(--signal) 85%, var(--ink)); }
.k-icon { display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; background: transparent; color: var(--canvas-ink); border-radius: var(--radius-sm); }
.k-icon:hover, .k-icon.on { background: var(--canvas-ink); color: var(--canvas); }

/* selection, as for every object: a wire outline and square handles */
.sel { position: absolute; border: 1.5px solid var(--wire); pointer-events: none; z-index: 6; }
.sel i { position: absolute; width: 8px; height: 8px; background: var(--paper); border: 1.5px solid var(--wire); }
.sel i:nth-child(1) { left: -5px; top: -5px; } .sel i:nth-child(2) { right: -5px; top: -5px; } .sel i:nth-child(3) { left: -5px; bottom: -5px; } .sel i:nth-child(4) { right: -5px; bottom: -5px; }

/* ------------------------------------------------ lanes */
.k-lane { position: absolute; background: var(--k-lane); }
.k-lane[style*='--lc'] { background: color-mix(in srgb, var(--lc) 10%, var(--k-lane)); }
.k-lane[style*='--lc']::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--lc); }
.k-lhead { position: absolute; left: 0; right: 0; top: 0; height: 48px; display: flex; align-items: center; gap: 8px; padding: 4px 4px 0 12px; }
.k-lname { font: 600 14px/20px var(--ui); color: var(--canvas-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.k-stage { display: inline-flex; align-items: center; gap: 2px; color: var(--k-meta); }
.k-count { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; color: var(--k-meta); white-space: nowrap; }
.k-count.at { color: var(--canvas-ink); }
.k-count.over { background: var(--danger); color: var(--paper); }
.k-lane.over .k-lhead { box-shadow: inset 0 -2px 0 var(--danger); } /* a 2px rule, not a shadow: inset rule under the header */
.k-lane .k-icon { width: 28px; height: 28px; }

/* cards are drawn by the layout; the body is only a drop surface */
.k-empty { position: absolute; display: grid; place-items: center; color: var(--k-meta); border: 1px dashed color-mix(in srgb, var(--canvas-ink) 40%, transparent); }
.k-add { position: absolute; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 8px; border: 0; background: transparent; color: var(--k-meta); font: 500 13px var(--ui); text-align: left; }
.k-add:hover { color: var(--canvas-ink); background: color-mix(in srgb, var(--canvas-ink) 6%, transparent); }
.k-input { position: absolute; padding: 8px 12px; background: var(--paper); border: 2px solid var(--ink); color: var(--ink); font: 500 13px/18px var(--ui); }
.k-input .caret { display: inline-block; width: 1.5px; height: 16px; margin-left: 1px; vertical-align: -3px; background: var(--ink); }
.k-input-hint { position: absolute; color: var(--k-meta); white-space: nowrap; }

/* ------------------------------------------------ cards */
.k-card { position: absolute; display: flex; flex-direction: column; gap: 8px; padding: 8px 12px; background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--k-edge); }
.k-card[style*='--fc'] { box-shadow: inset 4px 0 0 var(--fc), inset 0 0 0 1px var(--k-edge); padding-left: 16px; } /* accent edge from fill: inset rules, no blur */
.k-title { font: 500 13px/18px var(--ui); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; }
.k-cmeta { display: flex; align-items: center; gap: 6px; height: 24px; min-width: 0; color: var(--k-card-meta); }
.k-chips { display: flex; align-items: center; gap: 4px; height: 16px; min-width: 0; overflow: hidden; color: var(--k-card-meta); }
.k-chip { flex: none; height: 16px; padding: 0 5px; background: var(--lc); color: var(--sticky-ink); font: 600 11px/16px var(--ui); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
.k-more { flex: none; font: 600 11px/16px var(--ui); color: var(--k-card-meta); }
.k-due { flex: none; display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 5px; margin-left: -5px; white-space: nowrap; }
.k-due.soon, .k-due.overdue { margin-left: 0; }
.k-cmeta .k-spacer { flex: 1 1 auto; }
.k-due.soon { color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.k-due.overdue { background: var(--danger); color: var(--paper); }
.k-due.done { color: var(--k-card-meta); }
.k-ccount { flex: none; display: inline-flex; align-items: center; gap: 2px; font: 600 11px/16px var(--ui); }
.k-owner { flex: none; display: grid; place-items: center; width: 24px; height: 24px; background: var(--paper); color: var(--ink); font: 700 10px/1 var(--ui); letter-spacing: 0.02em; box-shadow: inset 0 0 0 2px var(--u); }
.k-owner.free { box-shadow: inset 0 0 0 1px var(--k-card-meta); } /* no account: hairline ring, no person colour */
.k-card.dim { opacity: var(--k-dim); }
.k-card.match { z-index: 2; }
.k-card.seld { outline: 1.5px solid var(--wire); outline-offset: 0; z-index: 3; }

/* comment pin, as src/render.ts pinMarkup draws it */
.k-pin { position: absolute; width: 26px; height: 26px; overflow: visible; z-index: 5; pointer-events: none; }
.k-pin path { fill: var(--u); stroke: var(--pin-ring); stroke-width: 1.5; }
.k-pin text { fill: var(--pin-ring); font: 700 11px var(--ui); text-anchor: middle; }

/* ------------------------------------------------ dragging: placeholder, ghost, drop line */
.k-card.source { box-shadow: none; background: transparent; outline: 1px dashed color-mix(in srgb, var(--canvas-ink) 55%, transparent); outline-offset: -1px; }
.k-card.source > * { visibility: hidden; }
.k-card.ghost { z-index: 12; box-shadow: inset 0 0 0 2px var(--canvas-ink); pointer-events: none; animation: k-lift var(--k-tween) ease-out; }
.k-card.ghost[style*='--fc'] { box-shadow: inset 4px 0 0 var(--fc), inset 0 0 0 2px var(--canvas-ink); }
@keyframes k-lift { from { transform: translate(-8px, -8px); opacity: 0.4; } to { transform: none; opacity: 1; } }
.k-cursor { position: absolute; z-index: 13; color: var(--canvas-ink); pointer-events: none; }
.k-cursor path:first-child { fill: var(--canvas); }
.k-drop { position: absolute; height: 2px; background: var(--canvas-ink); z-index: 8; pointer-events: none; }
.k-drop::before, .k-drop::after { content: ''; position: absolute; top: -3px; width: 8px; height: 8px; background: var(--canvas-ink); }
.k-drop::before { left: -4px; } .k-drop::after { right: -4px; }
.k-refuse { position: absolute; z-index: 8; pointer-events: none; outline: 2px dashed var(--danger); outline-offset: -2px; display: grid; place-items: center; }
.k-refuse span { padding: 2px 8px; background: var(--danger); color: var(--paper); }
.k-card.landing { transition: transform var(--k-tween) ease-out; }

/* keyboard move: the selected card keeps the wire outline; a 2px canvas-ink ring and a label say it is moving */
.k-card.kbd { outline: 1.5px solid var(--wire); z-index: 9; }
.k-kring { position: absolute; z-index: 9; pointer-events: none; box-shadow: 0 0 0 2px var(--canvas-ink); }
.k-ktag { position: absolute; z-index: 10; height: 20px; padding: 0 8px; background: var(--signal); color: var(--on-signal); white-space: nowrap; line-height: 20px; }

/* reduced motion: no lift, no landing tween */
@media (prefers-reduced-motion: reduce) { .k-card.ghost { animation: none; } .k-card.landing { transition: none; } }
body.reduce .k-card.ghost { animation: none; }
body.reduce .k-card.landing { transition: none; }

/* ------------------------------------------------ popovers and menus (DOM chrome, not board content) */
.pop { position: absolute; z-index: 15; background: var(--paper); color: var(--ink); border: 1px solid var(--ink); border-top-width: 2px; border-radius: var(--radius-md); }
.pop-sec { padding: 12px 16px; border-top: 1px solid var(--rule); }
.pop-sec:first-child { border-top: 0; }
.pop-h { color: var(--graphite); margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { height: 32px; padding: 0 10px; border: 1px solid var(--rule); background: var(--paper); color: var(--graphite); border-radius: var(--radius-xs); display: inline-flex; align-items: center; gap: 6px; }
.opt:hover { border-color: var(--ink); color: var(--ink); }
.opt.on { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.opt .sw { width: 10px; height: 10px; border-radius: var(--radius-xs); background: var(--lc); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--sticky-ink) 30%, transparent); }
.pop .input { width: 100%; height: 32px; padding: 0 10px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: var(--radius-sm); }
.pop .input::placeholder { color: var(--graphite); }
.pop-foot { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-top: 1px solid var(--rule); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 4px; font-size: 13px; font-weight: 600; }
.mi { display: flex; width: 100%; align-items: center; gap: 10px; height: 36px; padding: 0 16px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--ink); text-align: left; font-size: 13px; }
.mi:hover { background: var(--ink); color: var(--paper); }
.mi kbd { margin-left: auto; font: 600 11px var(--ui); color: var(--graphite); }
.mi:hover kbd { color: inherit; }
.mi.danger { color: var(--danger); }
.mi.danger:hover { background: var(--danger); color: var(--paper); }
.mi-rule { height: 1px; background: var(--rule); margin: 4px 0; }

/* quick-action bar stub for the selected container */
.qbar { position: absolute; z-index: 16; display: flex; align-items: center; gap: 2px; padding: 4px; background: var(--tray); color: var(--tray-text); border-radius: var(--radius-md); }
.qbar button { white-space: nowrap; height: 32px; padding: 0 10px; border: 0; border-radius: var(--radius-sm); background: transparent; color: inherit; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
.qbar button:hover { background: var(--tray-hover); }
.qbar button.primary { background: var(--signal); color: var(--on-signal); font-weight: 600; }
.qbar .sep { width: 1px; height: 20px; margin: 0 4px; background: var(--tray-line); }

.toast { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 30; display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 40px; background: var(--tray); color: var(--tray-text); border-left: 4px solid var(--danger); border-radius: var(--radius-md); font-size: 13px; font-weight: 500; white-space: nowrap; }

/* ------------------------------------------------ phone list sheet (DOM: also the keyboard and screen reader route) */

.sh-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; min-width: 40px; padding: 0 10px; border: 1px solid var(--ink); background: transparent; color: var(--ink); border-radius: var(--radius-sm); }
.sh-btn.icon { border: 0; padding: 0; width: 40px; }
.sh-btn.on { background: var(--signal); color: var(--on-signal); border-color: var(--signal); }
.tabs { flex: none; display: flex; gap: 24px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--rule); }
.tab { flex: none; height: 48px; padding: 0; border: 0; border-bottom: 2px solid transparent; border-radius: var(--radius-sm); background: none; color: var(--graphite); display: inline-flex; align-items: center; gap: 6px; }

.rows { flex: 1 1 auto; overflow-y: auto; margin: 0; padding: 0; list-style: none; }

.row[style*='--fc'] { box-shadow: inset 4px 0 0 var(--fc); }

const S = {

const lanes = () => LANES.map((l) => {

});
const matches = (c) => S.filter !== 'on' || (c.owner === ME && (c.labels || []).includes('bug'));
const wipOf = (l) => !l.wip ? null : { n: l.cards.length, max: l.wip, over: l.cards.length > l.wip, at: l.cards.length === l.wip };

/* ------------------------------------------------------------------ markup */
function dueMarkup(due) {
  if (!due) return '';
  const [kind, text] = due;
  if (kind === 'done') return `<span class="k-due done lbl" title="Done">${ic('check', 14)}${esc(text)}</span>`;
  const title = kind === 'overdue' ? 'Overdue' : kind === 'soon' ? 'Due soon' : 'Due';
  return `<span class="k-due ${kind} lbl" title="${title}">${esc(text)}</span>`;
}
function ownerMarkup(o) {
  if (!o) return '';
  const [name, ini, u] = PEOPLE[o];
  if (u === null) return `<span class="k-owner free" title="${esc(name)} (no account)">${ini}</span>`;
  return `<span class="k-owner" style="--u: var(--u${u})" title="${esc(name)}">${ini}</span>`;
}
function metaMarkup(c, maxChips = 3) {
  // Two rows: label chips (names never clip; past maxChips a +n count), then due, comments and owner.
  const labels = c.labels || [];
  let out = '';
  if (labels.length) {
    const chips = labels.slice(0, maxChips).map((id) => `<span class="k-chip" style="--lc: var(--s-${LABELS[id][1]})">${LABELS[id][0]}</span>`).join('');
    const more = labels.length > maxChips ? `<span class="k-more">+${labels.length - maxChips}</span>` : '';
    out += `<div class="k-chips">${chips}${more}</div>`;
  }
  if (c.due || c.comments || c.owner) {
    const parts = [];
    if (c.due) parts.push(dueMarkup(c.due));
    parts.push('<span class="k-spacer"></span>');
    if (c.comments) parts.push(`<span class="k-ccount" title="${c.comments} comments">${ic('comment', 14)}${c.comments}</span>`);
    if (c.owner) parts.push(ownerMarkup(c.owner));
    out += `<div class="k-cmeta">${parts.join('')}</div>`;
  }
  return out;
}
function cardEl(c, cls = '') {
  const el = document.createElement('div');
  el.className = `k-card ${cls}`.trim();
  el.dataset.id = c.id;
  if (c.fill) el.style.setProperty('--fc', `var(--s-${c.fill})`);
  el.innerHTML = `<div class="k-title">${esc(c.title)}</div>${metaMarkup(c)}`;
  el.setAttribute('role', 'listitem');
  return el;
}
const div = (cls, style, html = '') => {
  const el = document.createElement('div');
  el.className = cls;
  for (const [k, v] of Object.entries(style)) if (k.startsWith('--')) el.style.setProperty(k, v); else el.style[k] = v;
  el.innerHTML = html;
  return el;
};
const px = (r) => ({ left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });

/* ------------------------------------------------------------------ layout: a pure function of order and stored card heights */
function layoutContainer(ls, heights) {
  const out = { lanes: {}, cards: {}, adds: {} };
  const cw = K.laneW - 2 * K.lanePad;
  let tallest = 0;
  ls.forEach((l, i) => {
    const x = BOX.x + 1 + K.pad + i * (K.laneW + K.laneGap);
    const y = BOX.y + 1 + K.head + K.pad;
    let cy = y + K.laneHead;
    for (const c of l.cards) {
      out.cards[c.id] = { x: x + K.lanePad, y: cy, w: cw, h: heights[c.id] };
      cy += heights[c.id] + K.cardGap;
    }
    out.adds[l.id] = { x: x + K.lanePad, y: l.cards.length ? cy : cy + 56 + K.cardGap, w: cw, h: K.add };
    const body = Math.max((l.cards.length ? cy - y - K.laneHead : 56 + K.cardGap) + K.add + K.lanePad, K.minBody);
    tallest = Math.max(tallest, K.laneHead + body);
    out.lanes[l.id] = { x, y, w: K.laneW, h: 0 };
  });
  const laneH = tallest + K.dropZone; // plus an empty drop zone of one card
  for (const id in out.lanes) out.lanes[id].h = laneH;
  out.box = { x: BOX.x, y: BOX.y, w: 2 + 2 * K.pad + ls.length * K.laneW + (ls.length - 1) * K.laneGap + K.addLaneGap + K.addLane, h: 2 + K.head + 2 * K.pad + laneH };
  return out;
}

function measure(ls) {
  world.classList.remove('lod'); // heights are stored values: measured at full detail, never from the zoomed look
  const probe = div('', { position: 'absolute', left: '-9999px', top: '0', width: K.laneW - 2 * K.lanePad + 'px' });
  world.append(probe);
  const h = {};
  for (const l of ls) for (const c of l.cards) {
    const el = cardEl(c);
    el.style.position = 'relative';
    probe.append(el);
    h[c.id] = el.offsetHeight; // layout pixels; the world transform does not apply
  }
  probe.remove();
  return h;
}

  s.style.setProperty('--u', `var(--u${PEOPLE[who][2]})`);
  s.innerHTML = `<path d="M0 0V${-R}A${R} ${R} 0 1 1 ${R} 0Z" transform="translate(1 0)"/><text x="${R + 1}" y="${-R + 4}">${letter}</text>`;
  return s;
}

        return `<button class="lane-opt ${on ? 'on' : ''}" role="radio" aria-checked="${on}" ${blocked ? 'aria-disabled="true"' : ''}><span class="rd"></span><span class="sw" ${l.color ? `style="--lc: var(--s-${l.color})"` : ''}></span>${esc(l.name)}<span class="end lbl ${w && w.over ? 'over' : ''}">${end}</span></button>`;
      }).join('')}</div>
      <div class="bs-pos"><button class="opt lbl" aria-pressed="false">Top</button><button class="opt lbl on" aria-pressed="true">Bottom</button></div>
      <div class="bs-foot"><button>Cancel</button><button class="primary">Move</button></div>`;
    board.append(b);
  }
}

/* ------------------------------------------------------------------ zoom to fit the fake viewport */
let Z = 1;
const zoom = () => Z;
function fit() {
  const bw = board.clientWidth, bh = board.clientHeight;
  const right = L.box.x + L.box.w + 24, bottom = L.box.y + L.box.h + 24;
  let z = Math.min(1, bw / right, Math.max(0.3, (bh - 8) / bottom));
  let ox = 0, oy = 0;
  if (S.width === '390') {
    z = (bw - 24) / L.box.w;
    ox = 12 - L.box.x * z;
    oy = 132 - L.box.y * z;
  }
  Z = z;
  world.classList.toggle('lod', z < 0.4);
  world.style.transform = `translate(${ox}px, ${oy}px) scale(${z})`;
  $('#zoomLabel').textContent = Math.round(z * 100) + '%';
}

function note() {
  const n = {
    board: 'Unselected kanban among ordinary objects. Cards: long title (clamped to 3 lines), everything, minimal, comment pin.',
    container: 'Container selected: wire outline and handles, as every object. Moving it writes only its x and y.',
    menu: 'The container menu from the ⋯ in its header.',
    card: 'A selected card: the wire outline, and the quick-action bar with Open as the primary action.',
    adding: 'Add card inline: Enter adds and starts the next, Esc stops.',
    filter: 'The filter popover. Filters are personal and dim, never hide.',
    keyboard: 'Live region: "Moved to Doing, position 2 of 3".',
    sheet: 'Phone list sheet: lane tabs, card rows with a handle and a ⋯ menu, Add card bar.',
    moveto: 'Move to…: lane picker, then position. A full block lane is disabled.',
  }[S.state] || '';
  $('#p-note').textContent = n;
}

/* ------------------------------------------------------------------ play a drop: the 120 ms landing tween, or a snap */
function playDrop() {
  if (S.width === '390') return;
  const from = L.cards.c3;
  const to = { x: L.cards.d2.x, y: L.cards.d1.y + L.cards.d1.h + K.cardGap };
  const el = world.querySelector('.k-card[data-id="c3"]');
  if (!el) return;
  const reduced = S.reduce || matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.classList.remove('source');
  el.classList.add('landing');
  el.style.zIndex = 11;
  el.style.transform = `translate(${to.x - from.x}px, ${to.y - from.y}px)`;
  $('#live').textContent = 'Moved to Doing, position 2 of 4';
  setTimeout(render, reduced ? 900 : 1200);
}

/* ------------------------------------------------------------------ reviewer strip */
function syncUrl() {
  const p = new URLSearchParams(location.search);
  for (const [k, v] of Object.entries({ theme: S.theme, state: S.state, filter: S.filter, wip: S.wip, drag: S.drag, width: S.width })) p.set(k, v);
  if (S.reduce) p.set('reduce', '1'); else p.delete('reduce');
  history.replaceState(null, '', '?' + p);
}
const th = $('#p-theme');
th.innerHTML = THEMES.map(([id, n]) => `<option value="${id}">${n}</option>`).join('');
const ctl = { theme: '#p-theme', state: '#p-state', filter: '#p-filter', wip: '#p-wip', drag: '#p-drag', width: '#p-width' };
for (const [k, sel] of Object.entries(ctl)) {
  const el = $(sel);
  el.value = S[k];
  el.addEventListener('change', () => {
    S[k] = el.value;
    if (k === 'drag' && S.drag === 'block') S.wip = 'full';
    if (k === 'state' && (S.state === 'sheet' || S.state === 'moveto')) S.width = '390';
    if (k === 'state' && !['board', 'sheet', 'moveto'].includes(S.state)) S.width = 'desk'; // canvas states are desktop views
    if (k === 'width' && S.width === 'desk' && (S.state === 'sheet' || S.state === 'moveto')) S.state = 'board';
    for (const [k2, s2] of Object.entries(ctl)) $(s2).value = S[k2];
    syncUrl();
    render();
  });
}
$('#p-reduce').checked = S.reduce;
$('#p-reduce').addEventListener('change', (e) => { S.reduce = e.target.checked; syncUrl(); render(); });
$('#p-play').addEventListener('click', playDrop);
addEventListener('resize', () => render());
(document.fonts ? document.fonts.ready : Promise.resolve()).then(render);
render();

</script>
</body>
